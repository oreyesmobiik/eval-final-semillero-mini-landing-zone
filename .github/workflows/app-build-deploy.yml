name: app-build-deploy

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/app-build-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, aks-private]
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APP }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ACR using RBAC
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/miniapp:${{ github.sha }}"
          docker build -t "$IMAGE" ./app
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}
          admin: "false"
          use-kubelogin: "true"

      - name: Deploy app manifests
        run: |
          kubectl apply -f app/k8s/namespace.yaml
          kubectl apply -f app/k8s/serviceaccount.yaml
          sed "s|KEYVAULT_NAME_PLACEHOLDER|${{ vars.KEY_VAULT_NAME }}|g; s|TENANT_ID_PLACEHOLDER|${{ vars.AZURE_TENANT_ID }}|g" app/k8s/secretproviderclass.yaml | kubectl apply -f -
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" app/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f app/k8s/service.yaml
          kubectl rollout status deployment/miniapp -n miniapp --timeout=180s
