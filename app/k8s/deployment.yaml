apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniapp
  namespace: miniapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miniapp
  template:
    metadata:
      labels:
        app: miniapp
    spec:
      serviceAccountName: miniapp-sa
      automountServiceAccountToken: false
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: miniapp-kv-secrets
      containers:
        - name: miniapp
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SECRET_FILE_PATH
              value: /mnt/secrets-store/miniapp-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
